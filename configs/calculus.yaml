# Calculus segmentation baseline - YOLO11s-seg (Oral-Mamba)
task: calculus
model: yolo11s-seg.pt
task_type: segment

data:
  yaml_path: configs/calculus_data.yaml

train:
  imgsz: 640
  epochs: 100
  patience: 20
  amp: true
  seed: 42
  batch: auto
  workers: 4
  device: 0
  pretrained: true
  cache: false
  optimizer: auto
  lr0: 0.01
  augment:
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.0
    degrees: 5.0
    translate: 0.05
    scale: 0.2
    shear: 2.0
    fliplr: false
    mosaic: 0.5
    mixup: 0.0
    close_mosaic: 10
    erasing: 0.0
    blur: 0.0

eval:
  conf_threshold: 0.25
  iou_threshold: 0.5

inference:
  conf_threshold: 0.25
  iou_threshold: 0.5
  max_det: 100
